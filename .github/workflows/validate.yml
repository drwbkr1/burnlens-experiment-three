name: Validate repository controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report Python runtime
        run: python --version
      - name: Validate control plane
        run: python scripts/validate_repository.py
      - name: Run repository control tests
        run: python -m unittest discover -s tests -v
