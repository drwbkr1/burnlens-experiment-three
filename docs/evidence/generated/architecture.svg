<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="420" viewBox="0 0 1410 420" role="img" aria-labelledby="title desc">
<title id="title">Experiment Three 137-parameter architecture</title>
<desc id="desc">Public-safe numerical evidence; no benchmark pixels, labels, model weights, predictions, or geospatial rasters are embedded.</desc>
<rect width="100%" height="100%" fill="#f7f4ed"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17252a}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#4a5a60}.label{font-size:15px;font-weight:600}.small{font-size:13px;fill:#46565c}.metric{font-size:18px;font-weight:700}.axis{stroke:#98a6aa;stroke-width:1}.grid{stroke:#d7dddf;stroke-width:1}.selected{stroke:#ab3c2f;stroke-width:2;stroke-dasharray:6 5}.train{fill:none;stroke:#197278;stroke-width:3}.val{fill:none;stroke:#d95f32;stroke-width:3}</style>
<text x="70" y="55" class="title">A deliberately data-sized neural detector</text>
<text x="70" y="85" class="sub">One shared pointwise network • arbitrary H×W • no spatial-context or patch-position memory</text>
<rect x="70" y="145" width="180" height="100" rx="14" fill="#e8e4da" stroke="#31545a" stroke-width="2"/>
<text x="160.0" y="187" text-anchor="middle" class="metric">6 channels</text>
<text x="160.0" y="215" text-anchor="middle" class="small">pre/post S2</text>
<line x1="262" y1="195.0" x2="308" y2="195.0" stroke="#31545a" stroke-width="3"/>
<path d="M 298 188.0 L 308 195.0 L 298 202.0" fill="none" stroke="#31545a" stroke-width="3"/>
<rect x="320" y="145" width="210" height="100" rx="14" fill="#d9ece8" stroke="#31545a" stroke-width="2"/>
<text x="425.0" y="187" text-anchor="middle" class="metric">Conv 1×1</text>
<text x="425.0" y="215" text-anchor="middle" class="small">6 → 8 + ReLU</text>
<line x1="542" y1="195.0" x2="588" y2="195.0" stroke="#31545a" stroke-width="3"/>
<path d="M 578 188.0 L 588 195.0 L 578 202.0" fill="none" stroke="#31545a" stroke-width="3"/>
<rect x="600" y="145" width="210" height="100" rx="14" fill="#d9ece8" stroke="#31545a" stroke-width="2"/>
<text x="705.0" y="187" text-anchor="middle" class="metric">Conv 1×1</text>
<text x="705.0" y="215" text-anchor="middle" class="small">8 → 8 + ReLU</text>
<line x1="822" y1="195.0" x2="868" y2="195.0" stroke="#31545a" stroke-width="3"/>
<path d="M 858 188.0 L 868 195.0 L 858 202.0" fill="none" stroke="#31545a" stroke-width="3"/>
<rect x="880" y="145" width="210" height="100" rx="14" fill="#d9ece8" stroke="#31545a" stroke-width="2"/>
<text x="985.0" y="187" text-anchor="middle" class="metric">Conv 1×1</text>
<text x="985.0" y="215" text-anchor="middle" class="small">8 → 1 logit</text>
<line x1="1102" y1="195.0" x2="1148" y2="195.0" stroke="#31545a" stroke-width="3"/>
<path d="M 1138 188.0 L 1148 195.0 L 1138 202.0" fill="none" stroke="#31545a" stroke-width="3"/>
<rect x="1160" y="145" width="180" height="100" rx="14" fill="#e8e4da" stroke="#31545a" stroke-width="2"/>
<text x="1250.0" y="187" text-anchor="middle" class="metric">Probability</text>
<text x="1250.0" y="215" text-anchor="middle" class="small">sigmoid</text>
<rect x="70" y="300" width="1270" height="72" rx="12" fill="#fff" stroke="#d2cbc0"/>
<text x="95" y="332" class="metric">137 trainable parameters</text>
<text x="95" y="357" class="small">(6×8+8) + (8×8+8) + (8×1+1). Size was frozen before training; no model shopping followed.</text>
</svg>
